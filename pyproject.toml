[project]
name = "astreia-mrv-thor-notebook"
version = "0.1.0"
description = "Astreia MRV branch of THOR — reentry notebooks plus OpenSCAD geometry handoff"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.9.0",
    "polars",
    "matplotlib",
    "numpy>=1.26",
    "pydantic>=2.0",
    "duckdb>=1.0",
    "pyyaml",
    "scipy",
    "trimesh",
    "meshio",
]

[project.optional-dependencies]
astro = ["poliastro>=0.17", "astropy>=6.0"]
prop = ["cantera>=3.0"]
step = ["cadquery-ocp-novtk>=7.9"]

[tool.marimo]
format = "script"

[tool.marimo.venv]
path = ".venv"
writable = true

[tool.setuptools.packages.find]
include = ["thor*", "astreia_mrv*"]
exclude = ["notebooks*"]
